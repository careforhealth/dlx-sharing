# Site settings
title: "度洛西丁互助社区"
tagline: "你不是一个人在战斗 · 科学减药 · 同伴支持"
description: "由患者、家属、康复者共建的度洛西丁互助社区 — 15 篇系列指南：科学减药、症状应对与同伴支持"
url: "https://careforhealth.github.io"
baseurl: "/dlx-sharing"
lang: zh-CN
author: 度洛西丁互助社区
repo: https://github.com/careforhealth/dlx-sharing

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: pretty

# Plugins (GitHub Pages 白名单)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Defaults
defaults:
  - scope:
      path: "dlx"
    values:
      layout: post

# 系列指南分组（首页与目录页按此展示，文章顺序仍由各篇 order 决定）
groups_meta:
  - key: A
    name: 认识药物
    title: 认识药物 · 做决定
    icon: compass
    desc: 先搞懂这个药、可能的反应，再决定要不要减、怎么和医生谈。
  - key: B
    name: 减量方法
    title: 科学减量方法
    icon: chart
    desc: 为什么这么难戒、哪些坑要避，双曲线递减法具体怎么做。
  - key: C
    name: 症状应对
    title: 难受时怎么应对
    icon: heart
    desc: 营养、补充剂、全周期管理与特殊反应，难受时来这里找办法。
  - key: D
    name: 工具问答
    title: 工具与问答
    icon: book
    desc: 90天记录表帮你看清真相，20个高频问题解答常见疑惑。

# Navigation
navigation:
  - title: 首页
    url: /
  - title: 系列指南
    url: /guide/
  - title: 参与互助
    url: /join/

# Waline 评论（https://waline.js.org）
# 后端部署好后，把 server_url 换成你的 Vercel 地址即生效
waline:
  server_url: https://chwdiscuss.vercel.app

# Exclude from site build (保留在仓库，仅不发布)
exclude:
  - README.md
  - HWA
  - docs
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
